<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redesign Studio — Team Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=2" />
  <style>
    .fx { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .fx-grid {
      position: absolute; inset: -2px;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 46px 46px;
    }
    .fx-spot {
      position: absolute; inset: 0;
      background: radial-gradient(480px circle at 50% 38%, rgba(15,217,160,0.10), rgba(15,217,160,0.03) 38%, transparent 70%);
    }

    .login-wrap {
      min-height: 100vh;
      display: grid; place-items: center;
      padding: var(--space-lg);
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: var(--bg-2);
      border: 1px solid var(--border-default);
      border-radius: var(--r-xl);
      padding: var(--space-2xl) var(--space-xl) var(--space-xl);
      box-shadow: 0 30px 80px -30px rgba(0,0,0,0.7);
    }
    .login-brand {
      display: flex; align-items: center; gap: 10px;
      justify-content: center; margin-bottom: var(--space-lg);
    }
    .login-brand .brand-icon { color: var(--accent); font-size: 22px; }
    .login-brand .brand-name { font-weight: 600; letter-spacing: -0.01em; }
    .login-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent-text);
      justify-content: center; width: 100%; margin-bottom: 10px;
    }
    .login-title {
      font-family: var(--font-display); font-size: 34px; line-height: 1.05;
      text-align: center; margin-bottom: 6px;
    }
    .login-title em { font-style: italic; color: var(--accent); }
    .login-sub {
      text-align: center; color: var(--text-secondary);
      font-size: 14px; margin-bottom: var(--space-xl);
    }
    .field { margin-bottom: var(--space-md); }
    .field label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .field input {
      width: 100%; padding: 12px 14px;
      background: var(--bg-0); color: var(--text-primary);
      border: 1px solid var(--border-default); border-radius: var(--r-md);
      font-size: 15px; transition: border-color var(--duration) var(--ease);
    }
    .field input:focus { outline: none; border-color: var(--accent-border); }
    .login-btn { width: 100%; justify-content: center; margin-top: var(--space-sm); padding: 13px; font-size: 15px; }
    .login-error {
      display: none; margin-top: var(--space-md);
      background: var(--danger-dim); border: 1px solid rgba(248,113,113,0.3);
      color: #FCA5A5; padding: 10px 14px; border-radius: var(--r-md);
      font-size: 13px; text-align: center;
    }
    .login-error.show { display: block; }
    .login-foot {
      margin-top: var(--space-xl); text-align: center;
      font-size: 12px; color: var(--text-muted);
    }
    .login-foot a { color: var(--accent-text); }
  </style>
</head>
<body>
  <div class="fx" aria-hidden="true">
    <div class="fx-grid"></div>
    <div class="fx-spot"></div>
  </div>

  <main class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-brand">
        <span class="brand-icon">◈</span>
        <span class="brand-name">Redesign Studio</span>
      </div>
      <div class="login-eyebrow"><span class="eyebrow-dot"></span> Team access</div>
      <h1 class="login-title">Welcome <em>back.</em></h1>
      <p class="login-sub">Sign in to the outreach dashboard.</p>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="mdonkov" autocapitalize="none" spellcheck="false" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
        <span id="loginBtnText">Sign in</span>
        <span class="btn-arrow">→</span>
      </button>

      <div class="login-error" id="loginError"></div>

      <p class="login-foot">Private tool · <a href="index.html">← Back to site</a></p>
    </form>
  </main>

  <script type="module">
    import { supabase, EMAIL_DOMAIN } from './js/pmh-supabase.js';

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');

    // If already signed in, skip straight to the dashboard.
    (async () => {
      const { data } = await supabase.auth.getSession();
      if (data?.session) location.replace('dashboard.html');
    })();

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      btn.disabled = true;
      btnText.textContent = 'Signing in…';

      let username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      // Allow entering either "mdonkov" or "mdonkov@pm-helper.app"
      const email = username.includes('@') ? username : username + EMAIL_DOMAIN;

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        showError('Wrong username or password. Try again.');
        btn.disabled = false;
        btnText.textContent = 'Sign in';
        return;
      }
      location.replace('dashboard.html');
    });
  </script>
</body>
</html>
