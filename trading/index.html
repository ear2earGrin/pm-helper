  <link rel="stylesheet" href="../css/style.css?v=2" />
  <link rel="stylesheet" href="trading.css" />

  <!-- Binance data source. We fetch Binance's public market-data host directly from the
       browser. Binance 403s requests from cloud/edge IPs (a Cloudflare Worker proxy gets
       "Request blocked" from CloudFront), but a normal browser on a residential connection
       is fine, and data-api.binance.vision returns permissive CORS headers for public GET
       endpoints — so no proxy is needed for public klines. (worker-binance/ is left in the
       repo as a fallback for hosts whose region IS allowed but where CORS is the blocker.) -->
  <script>
    window.__BINANCE_PROXY_BASE__ = "https://data-api.binance.vision";
  </script>

  <!-- Charting: vendored standalone UMD build exposes window.LightweightCharts (Apache-2.0). -->
  <script src="vendor/lightweight-charts.standalone.production.js" defer></script>

  <!-- Trading UI, bundled to a single classic script with esbuild. GitHub Pages did not run the
       multi-file <script type="module"> graph; a classic script loads exactly like the site's
       other scripts (js/wizard.js, js/tools.js). Source of truth is trading/ui/*.js — regenerate
       the bundle with:  npm run build:trading -->
  <script src="trading.bundle.js" defer></script>
</head>
